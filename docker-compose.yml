# 开发/部署编排：redis 必起；mysql 可选（本机已装 MySQL80 服务时无需启动）
services:
  redis:
    image: redis:7-alpine
    container_name: cisp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 本机没有 MySQL 服务时取消注释
  # mysql:
